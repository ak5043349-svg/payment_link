<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">
        <!-- Icon -->
        <div class="login-icon">
            <div class="icon-circle">🔒</div>
        </div>

        <!-- Header -->
        <div class="login-header">
            <h2>Admin Login</h2>
            <p>Enter your credentials to access the admin panel</p>
        </div>

        <!-- Form -->
        <form id="loginForm" onsubmit="return false;">
            <!-- Username -->
            <div class="form-group">
                <label>👤 Username</label>
                <input type="text" id="adminUsername" placeholder="Enter username" value="admin" autofocus>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>🔑 Password</label>
                <div class="password-wrapper">
                    <input type="password" id="adminPassword" placeholder="Enter password" value="admin123">
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        👁️
                    </button>
                </div>
            </div>

            <!-- Login Button -->
            <button type="button" class="btn-login" id="loginBtn">🚀 Login</button>

            <!-- Error Message -->
            <div id="errorMsg" class="error-msg">❌ Invalid username or password! Please try again.</div>
        </form>

        <!-- Footer -->
        <div class="login-footer">
            <div class="secure-text">🔐 <span>Secure Admin Access</span></div>
            <div class="copyright">© 2025 EasyCash. All rights reserved.</div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
