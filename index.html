<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Login Protection -->
    <script>
        if (localStorage.getItem("adminLoggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>

    <link rel="stylesheet" href="style.css">
    <title>Admin Panel - Link Generator</title>
</head>

<body>

    <div class="admin-container">
        <h2>Payment Link Generator</h2>

        <input type="text" id="appName" placeholder="Application Name">
        <input type="text" id="productName" placeholder="Product Name">
        <input type="text" id="userName" placeholder="User Name">
        <input type="text" id="upiId" placeholder="UPI ID">
        <input type="number" id="amount" placeholder="Amount (₹)">
        <input type="number" id="timer" placeholder="Expiry Time (minutes)">

        <button onclick="generateLink()">Generate Link</button>

        <div id="resultArea" style="margin-top:20px;">
            <p>Generated Link:</p>
            <input type="text" id="outputLink" readonly>
            <button onclick="copyLink()">Copy Link</button>
        </div>
    </div>

    <script src="main.js"></script>

</body>
</html>
